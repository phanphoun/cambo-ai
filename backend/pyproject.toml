[project]
name = "cambo-ai-backend"
version = "0.2.0"
description = "FastAPI backend for CAMBO AI — multimodal chat, RAG, and tool calling"
readme = "README.md"
authors = [
    { name = "phanphoun", email = "phanphoun855@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pypdf>=5.0",
    "pillow>=10.0",
    "sentence-transformers>=3.0",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
